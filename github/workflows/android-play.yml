# Oyunu GitHub'ın Linux makinesinde Android için derler ve imzalı AAB dosyası üretir.
# Çalıştırmak için: GitHub > Actions > "Android Play" > Run workflow
# Bitince çalıştırma sayfasının altındaki "Artifacts" bölümünden suphe-agi-aab dosyasını indir.
# Gerekli gizli anahtarlar (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64   imza anahtarının base64 hali
#   ANDROID_KEYSTORE_PASSWORD anahtar deposu şifresi
#   ANDROID_KEY_ALIAS         anahtar adı (upload)
#   ANDROID_KEY_PASSWORD      anahtar şifresi
name: Android Play

on:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Bağımlılıkları kur
        run: npm install --no-audit --no-fund

      - name: Oyun dosyalarını hazırla
        run: node scripts/prepare-web.js

      - name: Android projesini oluştur
        run: |
          [ -d android ] || npx cap add android
          npx --yes @capacitor/assets@3.0.5 generate --android --iconBackgroundColor '#0c0819' --splashBackgroundColor '#0c0819'
          npx cap sync android
          node scripts/patch-android.js

      - name: Sürüm numarasını yaz
        run: |
          VERSION=$(node -p "require('./package.json').version")
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"$VERSION\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: AAB derle
        run: cd android && chmod +x gradlew && ./gradlew bundleRelease --no-daemon

      - name: İmzala
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 -keystore "$RUNNER_TEMP/upload.jks" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" -keypass "$ANDROID_KEY_PASSWORD" "$AAB" "$ANDROID_KEY_ALIAS"
          jarsigner -verify "$AAB"
          mkdir -p out && cp "$AAB" "out/suphe-agi-${{ github.run_number }}.aab"
          rm -f "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: suphe-agi-aab
          path: out/*.aab
